name: RecordBot CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests & Evals
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m venv vendor/venv
          source vendor/venv/bin/activate
          pip install numpy
          
      - name: Run Unit Tests
        run: |
          source vendor/venv/bin/activate
          python3 evals/run.py --unit
          
      - name: Run Contract & Integration Tests
        run: |
          source vendor/venv/bin/activate
          python3 evals/run.py --contract
          
      - name: Run Regression (Gold Standards)
        run: |
          source vendor/venv/bin/activate
          python3 evals/run.py --gold
          
      - name: Run Quality Audit
        run: |
          source vendor/venv/bin/activate
          python3 evals/run.py --quality
